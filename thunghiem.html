    function renderMath(text) {
      if (!text) return '';
      const regex = /(\$\$[\s\S]*?\$\$|\$[^$\n]+\$)/g;
      return text.replace(regex, (match) => {
        const isBlock = match.startsWith('$$') && match.endsWith('$$');
        const math = isBlock ? match.slice(2, -2) : match.slice(1, -1);
        if (window.katex) {
          try {
            return window.katex.renderToString(math.trim(), { displayMode: isBlock, throwOnError: false });
          } catch (e) {
            return `<span class="text-rose-500 font-mono">[Math Error]</span>`;
          }
        }
        return match;
      });
    }

    function quickLogin(u, p) {
      const user = DB.users.find(x => x.username === u && x.password === p);
      if (user) {
        AppState.currentUser = user;
        localStorage.setItem('CURRENT_AUTH_USER_V1', JSON.stringify(user));
        if (user.role === 'TEACHER') navigateTo('TEACHER_DASHBOARD');
        else navigateTo('STUDENT_EXAMS');
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value;
      quickLogin(u, p);
    }

    function handleRegisterStudentSubmit(e) {
      e.preventDefault();
      const fullName = document.getElementById('reg-fullname').value.trim();
      const username = document.getElementById('reg-username').value.trim().toLowerCase();
      const password = document.getElementById('reg-password').value;
      const classCode = document.getElementById('reg-classcode').value.trim().toUpperCase();

      if (DB.users.some(u => u.username.toLowerCase() === username)) {
        alert('Tên đăng nhập này đã tồn tại trên hệ thống!');
        return;
      }
      const targetClass = DB.classes.find(c => c.code === classCode);
      if (!targetClass) {
        alert(`Mã lớp "${classCode}" không tồn tại!`);
        return;
      }

      const newStudent = { id: 'u-std-' + Date.now(), username, password, role: 'STUDENT', fullName, school: targetClass.name, classCode };
      targetClass.studentCount++;
      DB.users.push(newStudent);
      saveDB(DB);

      alert(`Đăng ký thành công học sinh ${fullName} vào ${targetClass.name}!`);
      AppState.currentUser = newStudent;
      localStorage.setItem('CURRENT_AUTH_USER_V1', JSON.stringify(newStudent));
      navigateTo('STUDENT_EXAMS');
    }

      return `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-2xl font-black text-slate-900">Danh Sách Bài Thi Chờ Chấm Tự Luận</h2>
              <p class="text-xs text-slate-500">Giáo viên xem ảnh bài làm của học sinh, chấm điểm và ghi lời phê</p>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 text-slate-700 font-bold border-b">
                <tr>
                  <th class="p-3">Học sinh</th>
                  <th class="p-3">Đề thi</th>
                  <th class="p-3 text-center">Trắc nghiệm</th>
                  <th class="p-3 text-center">Tự luận</th>
                  <th class="p-3 text-right">Thao tác</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${DB.results.map(r => `
                  <tr>
                    <td class="p-3 font-bold text-slate-800">${r.studentName}</td>
                    <td class="p-3 text-slate-600">${r.examTitle}</td>
                    <td class="p-3 text-center font-bold text-emerald-600">${r.mcScore}đ</td>
                    <td class="p-3 text-center font-bold text-amber-600">${r.essayScore !== null ? `${r.essayScore}đ (Đã chấm)` : 'Chưa chấm'}</td>
                    <td class="p-3 text-right">
                      <button onclick="navigateTo('ESSAY_GRADING_DETAIL', { attemptId: '${r.attemptId}' })" class="px-3 py-1.5 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-lg shadow">
                        Mở Chấm Bài ✍️
                      </button>
                    </td>
                  </tr>
                `).join('')}
                ${DB.results.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-400">Chưa có bài thi nào được nộp.</td></tr>` : ''}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderEssayGradingDetail() {
      const result = DB.results.find(r => r.attemptId === AppState.activeGradingAttemptId);
      if (!result) return `<div>Không tìm thấy bài thi.</div>`;
      const exam = DB.exams.find(e => e.id === result.examId);
      const essayQuestions = exam.questionIds.map(id => DB.questions.find(q => q.id === id)).filter(q => q.type === 'ESSAY');

      return `
        <div class="space-y-6">
          <div class="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-3">
              <button onclick="navigateTo('ESSAY_GRADING_LIST')" class="p-2 text-slate-500 hover:bg-slate-100 rounded-xl"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
              <div>
                <h2 class="font-black text-slate-900 text-base">Chấm Tự Luận: ${result.studentName}</h2>
                <div class="text-xs text-slate-500">${exam.title} • Trắc nghiệm: ${result.mcScore}đ</div>
              </div>
            </div>
            <div class="text-right font-black text-blue-700 text-base">Tổng điểm: ${result.totalScore}đ / 10đ</div>
          </div>

          <div class="space-y-6">
            ${essayQuestions.map((q, qIdx) => {
              const studentAnswer = result.detailedAnswers.find(a => a.questionId === q.id) || {};
              const images = studentAnswer.essayImages || [];

              return `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                  <div class="flex items-center justify-between border-b pb-3">
                    <span class="font-bold text-sm text-slate-900">Câu tự luận ${qIdx + 1}: ${q.code}</span>
                    <span class="text-xs text-slate-500 font-mono">Thang điểm: 5.0đ</span>
                  </div>
                  <div class="text-xs text-slate-800 leading-relaxed font-medium">${renderMath(q.content)}</div>
                  <div class="bg-blue-50 border border-blue-100 rounded-xl p-3 text-xs text-blue-950"><strong>Đáp án chuẩn:</strong> ${renderMath(q.solution)}</div>

                  <div class="space-y-3 border-t pt-3">
                    <div class="flex items-center justify-between">
                      <span class="font-bold text-xs text-slate-800">Ảnh bài làm chụp từ giấy của học sinh:</span>
                      <div class="flex items-center gap-1">
                        <button onclick="rotateImage()" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-bold flex items-center gap-1"><i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> Xoay 90°</button>
                        <button onclick="zoomImage(0.2)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-bold flex items-center gap-1"><i data-lucide="zoom-in" class="w-3.5 h-3.5"></i> Phóng to</button>
                        <button onclick="zoomImage(-0.2)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-bold flex items-center gap-1"><i data-lucide="zoom-out" class="w-3.5 h-3.5"></i> Thu nhỏ</button>
                      </div>
                    </div>

                    ${images.length > 0 ? `
                      <div class="p-4 bg-slate-100 rounded-2xl overflow-auto text-center flex justify-center items-center min-h-[300px]">
                        ${images.map(img => `<img id="grading-preview-img" src="${img}" style="transform: rotate(${AppState.imageRotation}deg) scale(${AppState.imageZoom}); transition: transform 0.2s;" class="max-h-[500px] object-contain rounded-xl shadow-md border" />`).join('')}
                      </div>
                    ` : `<div class="p-6 text-center text-slate-400 bg-slate-50 rounded-xl text-xs">Học sinh không đính kèm ảnh bài làm.</div>`}
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-t pt-4 bg-slate-50 p-4 rounded-xl">
                    <div>
                      <label class="block font-bold text-xs text-slate-700 mb-1">Chấm điểm (Thang 5.0đ):</label>
                      <input id="grade-score-${q.id}" type="number" min="0" max="5" step="0.25" value="${studentAnswer.earnedPoints || 0}" class="w-full border border-slate-300 rounded-xl p-2 font-black text-sm text-blue-700 outline-none" />
                    </div>
                    <div class="md:col-span-2">
                      <label class="block font-bold text-xs text-slate-700 mb-1">Nhận xét của Thầy:</label>
                      <input id="grade-comment-${q.id}" type="text" placeholder="Trình bày tốt, vẽ hình chính xác..." value="${studentAnswer.teacherComment || ''}" class="w-full border border-slate-300 rounded-xl p-2 text-xs outline-none" />
                    </div>
                  </div>

                  <div class="text-right">
                    <button onclick="saveEssayGrade('${result.attemptId}', '${q.id}')" class="px-5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs rounded-xl shadow">Lưu Điểm & Lời Phê</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderExamResult() {
      const result = DB.results.find(r => r.attemptId === AppState.activeResultAttemptId);
      if (!result) return `<div>Không tìm thấy kết quả.</div>`;
      const exam = DB.exams.find(e => e.id === result.examId);
      return `
        <div class="max-w-4xl mx-auto space-y-6">
          <div class="bg-white p-8 rounded-3xl border border-slate-200 text-center space-y-4 shadow-sm">
            <h2 class="text-2xl font-black text-slate-900">${exam.title}</h2>
            <div class="text-5xl font-black text-blue-700">${result.totalScore} <span class="text-lg font-normal text-slate-400">/ 10đ</span></div>
            <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto text-xs font-bold pt-2 border-t">
              <div class="p-2 bg-slate-50 rounded-xl">Trắc nghiệm: ${result.mcScore}đ</div>
              <div class="p-2 bg-slate-50 rounded-xl">Tự luận: ${result.essayScore !== null ? `${result.essayScore}đ` : 'Đang chấm'}</div>
            </div>
          </div>
        </div>
      `;
    }

    // ================= ACTION HANDLERS =================

    function downloadWordTemplate() {
      const templateContent = `BẢN MẪU SOẠN THẢO CÂU HỎI THỊNH NGUYỄN MATH 1.0 (KHỐI 6, 7, 8, 9)
===============================================================================
HƯỚNG DẪN SOẠN THẢO:
1. Mỗi câu hỏi bắt đầu bằng: "Câu [Số]: [[MứcĐộ]] [[MãKhối]-[PhânMôn]-[MãChương]-[MãBài]]"
2. 4 phương án: A., B., C., D. (Đặt dấu * trước chữ cái đáp án đúng)
3. Công thức Toán: Bao quanh bởi dấu $...$
===============================================================================

Câu 1: [NB] [TN6-DS-CH01-B01] Tập hợp các số tự nhiên $\\mathbb{N}^*$ là:
*A. $\\{1; 2; 3; 4; \\dots\\}$
B. $\\{0; 1; 2; 3; 4; \\dots\\}$
C. $\\{0; 2; 4; 6; \\dots\\}$
D. $\\{1; 3; 5; 7; \\dots\\}$
Lời giải: Tập hợp $\\mathbb{N}^*$ gồm các số tự nhiên khác 0.
`;
      const blob = new Blob([templateContent], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'THINH_NGUYEN_MATH_TEMPLATE_WORD.doc';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function setGradeFilter(grade) { AppState.selectedGradeFilter = grade; renderApp(); }
    function openImportModal() { document.getElementById('modal-import').classList.remove('hidden'); }
    function closeImportModal() { document.getElementById('modal-import').classList.add('hidden'); }

    function handleImportTextSubmit() {
      const text = document.getElementById('import-text-area').value;
      if (!text.trim()) return alert('Vui lòng dán nội dung!');
      alert('Đã import thành công câu hỏi!');
      closeImportModal();
    }

    function startExam(examId) {
      AppState.examRoom = {
        examId,
        attemptId: 'att-' + Date.now(),
        currentIndex: 0,
        mcAnswers: {},
        essayTexts: {},
        essayImages: {},
        flags: {},
        remainingSeconds: 45 * 60,
        timerInterval: null
      };
      navigateTo('EXAM_ROOM');
    }

    function navQ(idx) { AppState.examRoom.currentIndex = idx; renderApp(); }
    function selectMCOption(qId, optId) { AppState.examRoom.mcAnswers[qId] = optId; renderApp(); }

    function handleImageUpload(e, qId) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        if (!AppState.examRoom.essayImages[qId]) AppState.examRoom.essayImages[qId] = [];
        AppState.examRoom.essayImages[qId].push(event.target.result);
        renderApp();
      };
      reader.readAsDataURL(file);
    }

    function removeImage(qId, idx) {
      AppState.examRoom.essayImages[qId].splice(idx, 1);
      renderApp();
    }

    function rotateImage() {
      AppState.imageRotation = (AppState.imageRotation + 90) % 360;
      const el = document.getElementById('grading-preview-img');
      if (el) el.style.transform = `rotate(${AppState.imageRotation}deg) scale(${AppState.imageZoom})`;
    }

    function zoomImage(delta) {
      AppState.imageZoom = Math.max(0.5, Math.min(3, AppState.imageZoom + delta));
      const el = document.getElementById('grading-preview-img');
      if (el) el.style.transform = `rotate(${AppState.imageRotation}deg) scale(${AppState.imageZoom})`;
    }

    function confirmSubmit() {
      if (!confirm('Xác nhận nộp bài thi?')) return;
      const exam = DB.exams.find(e => e.id === AppState.examRoom.examId);
      const questions = exam.questionIds.map(id => DB.questions.find(q => q.id === id));
      let mcScore = 0;
      let detailedAnswers = [];

      questions.forEach(q => {
        if (q.type === 'MULTIPLE_CHOICE') {
          const userOpt = AppState.examRoom.mcAnswers[q.id];
          const isCorrect = q.options.find(o => o.isCorrect)?.id === userOpt;
          if (isCorrect) mcScore += 5;
          detailedAnswers.push({ questionId: q.id, type: 'MULTIPLE_CHOICE', isCorrect, userOpt });
        } else {
          detailedAnswers.push({
            questionId: q.id,
            type: 'ESSAY',
            essayImages: AppState.examRoom.essayImages[q.id] || [],
            earnedPoints: 0,
            teacherComment: ''
          });
        }
      });

      const newResult = {
        attemptId: AppState.examRoom.attemptId,
        examId: exam.id,
        examTitle: exam.title,
        studentId: AppState.currentUser.id,
        studentName: AppState.currentUser.fullName,
        mcScore,
        essayScore: null,
        totalScore: mcScore,
        detailedAnswers
      };

      DB.results.unshift(newResult);
      saveDB(DB);
      AppState.activeResultAttemptId = newResult.attemptId;
      navigateTo('EXAM_RESULT');
    }

    function saveEssayGrade(attemptId, questionId) {
      const score = parseFloat(document.getElementById(`grade-score-${questionId}`).value) || 0;
      const comment = document.getElementById(`grade-comment-${questionId}`).value.trim();
      const res = DB.results.find(r => r.attemptId === attemptId);
      if (!res) return;

      const ans = res.detailedAnswers.find(a => a.questionId === questionId);
      if (ans) {
        ans.earnedPoints = score;
        ans.teacherComment = comment;
      }
      res.essayScore = score;
      res.totalScore = res.mcScore + score;
      saveDB(DB);

      alert(`Đã lưu điểm tự luận (${score}đ) thành công!`);
      renderApp();
    }

    function deleteQuestion(id) {
      if (!confirm('Xác nhận xóa câu hỏi này?')) return;
      DB.questions = DB.questions.filter(q => q.id !== id);
      saveDB(DB);
      renderApp();
    }

    function renderApp() {
      document.getElementById('nav-user-area').innerHTML = renderNav();
      const viewport = document.getElementById('app-viewport');

      if (!AppState.currentUser && AppState.currentRoute !== 'REGISTER_STUDENT') {
        AppState.currentRoute = 'LOGIN';
      }

      switch (AppState.currentRoute) {
        case 'LOGIN': viewport.innerHTML = renderLoginView(); break;
        case 'REGISTER_STUDENT': viewport.innerHTML = renderRegisterStudentView(); break;
        case 'TEACHER_DASHBOARD': viewport.innerHTML = renderTeacherDashboard(); break;
        case 'QUESTIONS': viewport.innerHTML = renderQuestionBank(); break;
        case 'STUDENT_EXAMS': viewport.innerHTML = renderStudentExams(); break;
        case 'EXAM_ROOM': viewport.innerHTML = renderExamRoom(); break;
        case 'EXAM_RESULT': viewport.innerHTML = renderExamResult(); break;
        case 'ESSAY_GRADING_LIST': viewport.innerHTML = renderEssayGradingList(); break;
        case 'ESSAY_GRADING_DETAIL': viewport.innerHTML = renderEssayGradingDetail(); break;
        default: viewport.innerHTML = renderTeacherDashboard();
      }

      if (window.lucide) window.lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => renderApp());
  </script>
</body>
</html>
